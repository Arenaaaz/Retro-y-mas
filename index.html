<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro y Más</title>
<link rel="icon" type="image/png" href="img/logo.png?v=1">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Encabezado -->
  <header class="header">
    <div class="header-container">
      <div class="header-info">
        <h1 id="nombre-tienda">Retro y más</h1>
        <p id="subtitulo-tienda">Donde encuentras las camisetas retro de mejor calidad</p>
      </div>
      <div class="header-logo-wrapper">
        <img src="img/logo.png" alt="Logo Retro y más" class="header-logo">
      </div>
    </div>
  </header>

  <!-- Categorías / Filtros -->
<!-- Barra de Búsqueda y Categorías -->
  <nav class="categorias-nav">
    <div class="busqueda-container">
      <input type="text" id="input-busqueda" placeholder="🔍 Buscar camiseta por equipo o año..." onkeyup="filtrarPorBusqueda()">
    </div>
    <div class="categorias-container" id="contenedor-categorias">
      <button class="btn-categoria active" onclick="filtrarCategoria('todos')">Todos</button>
      <!-- Categorías dinámicas -->
    </div>
  </nav>

  <!-- Lista de Productos -->
  <main class="main-container">
    <div class="grid-productos" id="contenedor-productos">
      <!-- Se carga dinámicamente desde script.js -->
    </div>
  </main>

<!-- Barra Flotante del Carrito -->
  <div class="barra-carrito">
    <div class="carrito-info">
      <span class="label-total">Total acumulado:</span>
      <span id="total-precio" class="precio-total">$ 0 COP</span>
    </div>
    
    <div class="acciones-carrito">
      <button class="btn-ver-pedido" onclick="abrirModalPedido()">
        🛒 Ver pedido (<span id="contador-cant">0</span>)
      </button>
      <button class="btn-whatsapp" onclick="enviarWhatsApp()">
        <span>Pedir por WhatsApp</span>
      </button>
    </div>
  </div>

  <!-- Modal / Ventana Flotante de Revisión de Pedido -->
  <div id="modal-pedido" class="modal-overlay">
    <div class="modal-contenido">
      <div class="modal-header">
        <h2>Resumen de tu Pedido</h2>
        <button class="btn-cerrar-modal" onclick="cerrarModalPedido()">&times;</button>
      </div>
      
      <div id="lista-detallada-pedido" class="modal-body">
        <!-- Se genera dinámicamente desde JS -->
      </div>
      
      <div class="modal-footer">
        <div class="modal-total-info">
          <span>Total:</span>
          <strong id="modal-total-precio">$ 0 COP</strong>
        </div>
        <button class="btn-whatsapp" onclick="enviarWhatsApp()" style="width: 100%; justify-content: center; margin-top: 10px;">
          Confirmar y Enviar a WhatsApp
        </button>
      </div>
    </div>
  </div>
  <!-- Botón Flotante de WhatsApp para Consultas -->
<a href="https://wa.me/573013276930?text=Hola%20Retro%20y%20más,%20tengo%20una%20consulta%20sobre%20un%20producto" 
   class="btn-flotante-wa" 
   target="_blank" 
   aria-label="Contactar por WhatsApp">
  <svg width="28" height="28" fill="currentColor" viewBox="0 0 24 24">

</a>
<script src="script.js"></script>

  
</body>
</html>
